name: PR Check & Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  validate:
    name: Check TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: sa-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate Serverless Package
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ secrets.DB_SSL }}
          DB_SSL_REJECT_UNAUTHORIZED: ${{ secrets.DB_SSL_REJECT_UNAUTHORIZED }}
          DB_SECURITY_GROUP_ID: ${{ secrets.DB_SECURITY_GROUP_ID }}
          DB_SUBNET_ID_1: ${{ secrets.DB_SUBNET_ID_1 }}
          DB_SUBNET_ID_2: ${{ secrets.DB_SUBNET_ID_2 }}
        run: npx serverless package

      - name: Check Package Size (< 250 MB)
        run: |
          ZIP_FILE=$(ls .serverless/*.zip | head -n 1)
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No zip artifact found in .serverless/"
            exit 1
          fi

          # Extract unzipped total bytes from unzip listing summary
          UNZIPPED_BYTES=$(unzip -l "$ZIP_FILE" | tail -n 1 | awk '{print $1}')
          ZIP_BYTES=$(stat -c%s "$ZIP_FILE")

          UNZIPPED_MB=$(( UNZIPPED_BYTES / 1024 / 1024 ))
          ZIP_MB=$(( ZIP_BYTES / 1024 / 1024 ))

          echo "Zip archive size: ${ZIP_MB} MB (${ZIP_BYTES} bytes)"
          echo "Unzipped size: ${UNZIPPED_MB} MB (${UNZIPPED_BYTES} bytes)"

          # AWS Lambda unzipped limit is 250 MB (262,144,000 bytes)
          MAX_BYTES=262144000

          if [ "$UNZIPPED_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Unzipped package size (${UNZIPPED_MB} MB / ${UNZIPPED_BYTES} bytes) exceeds AWS Lambda 250 MB limit!"
            exit 1
          fi

          echo "✅ Package size check passed successfully!"
